# ================================================
# CAAC Gateway - Layer 3 (Policy Enforcement Point)
# Version 3.0 — Security Hardened
# ================================================

server.port=5051
spring.application.name=caac-gateway

# CAAC Oracle (Layer 2)
oracle.url=http://localhost:5050/api/access/evaluate

# IPFS local gateway
ipfs.gateway.url=${CAAC_IPFS_GATEWAY_URL:http://127.0.0.1:8080/ipfs}
ipfs.api.url=${CAAC_IPFS_API_URL:http://127.0.0.1:5001}
ipfs.upload.connect-timeout-ms=${CAAC_IPFS_UPLOAD_CONNECT_TIMEOUT_MS:10000}
ipfs.upload.read-timeout-ms=${CAAC_IPFS_UPLOAD_READ_TIMEOUT_MS:300000}
stream.chunk.delay.ms=500

# Algorithm 2: revocation polling interval in milliseconds
revocation.interval.ms=5000

logging.level.org.example.gateway=INFO

# ================================================
# SECURITY CONFIGURATION (v3.0)
# ================================================

# --- HMAC Keys (Security #1, #9) ---
oracle.hmac.key=${CAAC_ORACLE_HMAC_KEY}
audit.hmac.key=${CAAC_AUDIT_HMAC_KEY}
csrf.hmac.key=${CAAC_CSRF_HMAC_KEY:${CAAC_AUDIT_HMAC_KEY:}}

# --- CAPTCHA ---
# Provider: math, hcaptcha, both, or auto. Math remains the no-CDN fallback.
captcha.enabled=${CAAC_CAPTCHA_ENABLED:true}
captcha.provider=${CAAC_CAPTCHA_PROVIDER:math}
captcha.secret=${CAAC_HCAPTCHA_SECRET:${CAAC_CAPTCHA_SECRET:${CAAC_CAPTCHA_ID:}}}
captcha.sitekey=${CAAC_HCAPTCHA_SITEKEY:${CAAC_CAPTCHA_SITEKEY:${CAAC_CAPTCHA_KEY:}}}
captcha.verify-url=${CAAC_HCAPTCHA_VERIFY_URL:https://api.hcaptcha.com/siteverify}

# --- Verification toggles ---
email.verification.enabled=${CAAC_EMAIL_VERIFICATION_ENABLED:true}
phone.verification.enabled=${CAAC_PHONE_VERIFICATION_ENABLED:false}
app.registration.admin-approval.required=${CAAC_ADMIN_APPROVAL_REQUIRED:false}

# --- Base URL ---
app.base-url=${CAAC_BASE_URL:http://10.216.217.146:5051}
app.frontend.login-url=${CAAC_FRONTEND_LOGIN_URL:http://10.216.217.146/icenter/login.html}
app.cors.allowed-origins=${CAAC_CORS_ALLOWED_ORIGINS:http://10.216.217.146,http://10.216.217.146:5052,http://127.0.0.1:5052,http://localhost:5052,http://127.0.0.1:5173,http://localhost:5173}
app.prototype.endpoints.enabled=${CAAC_PROTOTYPE_ENDPOINTS_ENABLED:true}
app.prototype.admin-only=${CAAC_PROTOTYPE_ADMIN_ONLY:true}


# --- Email (QQ Mail SMTP) ---
spring.mail.host=smtp.qq.com
spring.mail.port=465
spring.mail.username=${CAAC_MAIL_USERNAME:}
spring.mail.password=${CAAC_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
mail.from=2837572340@qq.com

# ================================================
# FILE UPLOAD SIZE LIMITS
# ================================================
spring.servlet.multipart.max-file-size=400MB
spring.servlet.multipart.max-request-size=400MB
