<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAAC — Messages</title>
<link rel="stylesheet" href="css/common.css">
<style>
  .msg-app { max-width: 720px; margin: 0 auto; padding: 20px; }
  .msg-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--r); overflow: hidden;
    height: calc(100vh - 120px);
    height: calc(100dvh - 120px);
    display: flex; flex-direction: column;
  }
  .msg-header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .msg-header h2 { font-size: 15px; font-weight: 600; }
  .msg-status { display: flex; align-items: center; gap: 6px; font-size: 11px; font-family: var(--mono); }
  .msg-area {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .msg-empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--text3); font-size: 13px; text-align: center; line-height: 1.7;
  }
  .bubble {
    max-width: 80%; padding: 10px 14px;
    border-radius: 12px; line-height: 1.5;
  }
  .bubble-mine {
    align-self: flex-end;
    background: var(--accent2); border: 1px solid rgba(94,164,248,0.2);
  }
  .bubble-theirs {
    align-self: flex-start;
    background: var(--bg3); border: 1px solid var(--border);
  }
  .bubble-content { font-size: 13px; color: var(--text); }
  .bubble-meta {
    font-size: 9px; font-family: var(--mono); color: var(--text3);
    margin-top: 4px; text-align: right;
  }
  .bubble-sender {
    font-size: 10px; font-family: var(--mono); color: var(--teal);
    margin-bottom: 2px;
  }
  .msg-input-row {
    padding: 12px 16px; border-top: 1px solid var(--border);
    display: flex; gap: 8px;
  }
  .msg-input-row input {
    flex: 1; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); font-family: var(--mono); font-size: 12px;
    padding: 10px 14px; border-radius: 8px; outline: none;
    transition: border-color .15s;
  }
  .msg-input-row input:focus { border-color: var(--accent); }
  .msg-input-row button {
    padding: 10px 20px; border-radius: 8px; border: none;
    background: var(--accent); color: #fff; font-size: 12px;
    font-weight: 500; cursor: pointer; transition: background .15s;
  }
  .msg-input-row button:hover { background: #4a93e8; }
  @media (max-width: 520px) {
    .msg-app { padding: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
    .msg-app header { margin-bottom: 10px; }
    .msg-card {
      height: calc(100vh - 90px);
      height: calc(100dvh - 90px);
    }
    .msg-header { padding: 12px 14px; }
    .msg-header h2 { font-size: 14px; }
    .msg-area { padding: 12px; }
    .bubble { max-width: 88%; padding: 9px 12px; }
    .bubble-content { font-size: 13px; line-height: 1.45; }
    .msg-input-row { padding: 10px; gap: 8px; }
    .msg-input-row input {
      padding: 11px 14px;
      font-size: 16px; /* prevent iOS zoom on focus */
      border-radius: 10px;
    }
    .msg-input-row button {
      padding: 11px 18px;
      font-size: 13px;
      min-height: 44px;
      border-radius: 10px;
    }
  }
</style>
</head>
<body class="space-page msg-space">
<canvas class="caac-space-bg" data-caac-stars data-density="38" data-link="118" data-speed="0.12" data-packets="4" aria-hidden="true"></canvas>

<div class="msg-app">
  <header style="margin-bottom: 16px">
    <div class="logo">
      <div class="logo-mark" style="width:34px;height:34px;font-size:13px;border-radius:8px">CA</div>
      <div>
        <h1 style="font-size:16px">Messages</h1>
        <p>Direct messages with admin</p>
      </div>
    </div>
    <div class="hdr-links">
      <a href="index.html">Dashboard</a>
    </div>
  </header>

  <div class="msg-card">
    <div class="msg-header">
      <h2>Admin channel</h2>
      <div class="msg-status">
        <span id="adminDot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--text3);opacity:.4"></span>
        <span id="adminStatusText">checking...</span>
      </div>
    </div>
    <div class="msg-area" id="msgArea">
      <div class="msg-empty">Loading messages...</div>
    </div>
    <div class="msg-input-row">
      <input type="text" id="msgInput" placeholder="Type a message..." autocomplete="off" onkeydown="if(event.key==='Enter')sendMsg()">
      <button onclick="sendMsg()">Send</button>
    </div>
  </div>
</div>

<script type="module" src="/src/entries/messages.js"></script>
</body>
</html>
